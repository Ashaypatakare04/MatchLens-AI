services:
  postgres:
    image: postgres:16-alpine
    container_name: matchlens-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matchlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchlens_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-matchlens_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchlens_user} -d ${POSTGRES_DB:-matchlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Run migrations idempotently before web and worker services start
  migration:
    build:
      context: .
      target: worker
    container_name: matchlens-migration
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-matchlens_user}:${POSTGRES_PASSWORD:-matchlens_local_dev_password}@postgres:5432/${POSTGRES_DB:-matchlens_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  web:
    build:
      context: .
      target: web
    container_name: matchlens-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-matchlens_user}:${POSTGRES_PASSWORD:-matchlens_local_dev_password}@postgres:5432/${POSTGRES_DB:-matchlens_db}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-matchlens-local-dev-secret-32-chars-minimum}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      RESUME_RETENTION_DAYS: ${RESUME_RETENTION_DAYS:-180}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MONITORING_API_KEY: ${MONITORING_API_KEY:-}
    volumes:
      - storage_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    container_name: matchlens-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-matchlens_user}:${POSTGRES_PASSWORD:-matchlens_local_dev_password}@postgres:5432/${POSTGRES_DB:-matchlens_db}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-matchlens-local-dev-secret-32-chars-minimum}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_STALE_TIMEOUT_MS: ${WORKER_STALE_TIMEOUT_MS:-300000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - storage_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage_data:
