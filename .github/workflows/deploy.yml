name: MatchLens AI - Production Deployment & Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web-only
          - worker-only
          - migrations-only
      rollback:
        description: 'Set to true if rolling back to a previous git SHA'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  pre-deploy-check:
    name: Verify CI Gates Before Production Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Git Reference
        run: |
          echo "Deploying commit: ${{ github.sha }} to production environment"
          echo "Rollback flag: ${{ github.event.inputs.rollback || 'false' }}"

  database-migrations:
    name: Apply Production Database Migrations
    needs: pre-deploy-check
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'migrations-only' || github.event.inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Database Migrations Against Production DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error ::DATABASE_URL secret is not configured in repository. Deployment aborted to prevent running against an unmigrated database."
            exit 1
          fi
          npm run db:migrate

  deploy-web:
    name: Deploy Web Application (Vercel / Cloud Container)
    needs: [database-migrations]
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'web-only' || github.event.inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Post-Deployment Health Probes
        env:
          APP_BASE_URL: ${{ secrets.NEXTAUTH_URL || 'https://matchlens-ai.vercel.app' }}
        run: |
          echo "Probing liveness endpoint ($APP_BASE_URL/api/healthz)..."
          curl -sSf --max-time 10 "$APP_BASE_URL/api/healthz" || echo "Warning: Health probe unreachable or URL unconfigured."
          echo "Probing readiness endpoint ($APP_BASE_URL/api/readyz)..."
          curl -sSf --max-time 10 "$APP_BASE_URL/api/readyz" || echo "Warning: Readiness probe unreachable or URL unconfigured."

  deploy-worker:
    name: Deploy Background Worker Daemon (Docker / Container Host)
    needs: [database-migrations]
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'worker-only' || github.event.inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Container Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
